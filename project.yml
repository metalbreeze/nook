name: Nook
options:
  bundleIdPrefix: com.metalbreeze
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_TESTABILITY: YES
targets:
  Nook:
    type: application
    platform: macOS
    sources:
      - Sources/Nook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metalbreeze.Nook
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Nook.entitlements
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
        # Stable signing identity so TCC (Accessibility + Screen Recording)
        # grants persist across rebuilds. Ad-hoc signing causes macOS to
        # re-prompt every launch and drop grants on each rebuild.
        CODE_SIGN_IDENTITY: "Developer ID Application: Shu Nie (MKSL2N4Y23)"
        DEVELOPMENT_TEAM: MKSL2N4Y23
      configs:
        # Hardened Runtime is required for notarization, but enabling it for
        # Debug breaks `xcodebuild test`: the host app enforces library
        # validation, and the ad-hoc-signed test bundle (different Team ID)
        # then fails to load. So we enable it only for the Release build that
        # actually gets notarized.
        Release:
          ENABLE_HARDENED_RUNTIME: YES
          # Notarization requires a secure (Apple-server) timestamp in the
          # signature; a plain build omits it.
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # Don't inject the debug base entitlements — they add
          # com.apple.security.get-task-allow, which notarization rejects.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  NookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/NookTests
    dependencies:
      - target: Nook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.metalbreeze.NookTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Nook:
    build:
      targets:
        Nook: all
        NookTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NookTests
